server {
    listen 80;
    server_name _;

    # Static assets
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed JS/CSS aggressively, but never cache index.html.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse-proxy build requests to the Maven service so the browser
    # never has to know the backend URL. Long timeout because Maven warmup
    # on first call can pull tens of MB of dependencies.
    location /build {
        proxy_pass http://backend:8787/build;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 25m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://backend:8787/health;
        proxy_set_header Host $host;
    }

    # SPA fallback — anything else falls back to index.html so client routing
    # works (currently no client routing, but future-proof).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
